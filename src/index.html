<!doctype html>
<!-- lang="es": idioma del HTML que genera el prerender (en el build no hay idioma del
     visitante). Al arrancar, EdasSeoService lo ajusta al idioma activo. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>fantasyfutbol</title>
  <base href="/">
  <!-- Descripción de respaldo: cada página pública la sobrescribe con la suya (EdasSeoService). -->
  <meta name="description" content="Competiciones, calendarios, clasificaciones, partidos, equipos y jugadores de fútbol, con las puntuaciones de cada jugador en cada partido.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- Splash de arranque en frío (#app-splash). Plantilla y explicación completa en
       projects/edas-ng/docs/splash.html. Va inline para pintarse en el primer frame, antes de
       que llegue el bundle; AppComponent lo oculta con EdasSplashService.markReady(). -->

  <style>
    html[data-splash-theme] {
      background-color: #f5f5f7;
    }

    html[data-splash-theme="dark"] {
      background-color: #000000;
    }

    /* body hereda de <html> el mismo color: una sola fuente de verdad, sin duplicar hex */
    html[data-splash-theme] body {
      background-color: inherit;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      transition: opacity 350ms ease;
    }

    html[data-splash-theme="light"] #app-splash {
      background-color: #f5f5f7;
    }

    #app-splash.app-splash--hidden {
      opacity: 0;
      pointer-events: none;
    }

    .app-splash__stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Halo muy tenue: solo compositor (opacity), sin afectar layout */
    .app-splash__glow {
      position: absolute;
      width: 220px;
      height: 220px;
      max-width: 70vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0) 70%);
      animation: app-splash-breathe 2400ms ease-in-out 650ms infinite alternate;
      pointer-events: none;
    }

    html[data-splash-theme="light"] .app-splash__glow {
      background: radial-gradient(circle, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0) 70%);
    }

    .app-splash__logo {
      position: relative;
      width: 160px;
      max-width: 55vw;
      height: auto;
      opacity: 0;
      animation:
        app-splash-fade-in 600ms ease forwards,
        app-splash-breathe 2400ms ease-in-out 650ms infinite alternate;
    }

    html[data-splash-theme="dark"] .app-splash__logo {
      filter: invert(1);
    }

    @keyframes app-splash-fade-in {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes app-splash-breathe {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-splash {
        transition-duration: 1ms;
      }

      .app-splash__glow {
        animation: none;
      }

      .app-splash__logo {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <script>
    // Decide el tema ANTES del primer paint y lo aplica a <html> (y, vía CSS,
    // a <body> y #app-splash). Clave de localStorage duplicada a propósito
    // de edas-ng (EdasStorageKeys.theme = 'color_theme', ver core/config.ts):
    // este script corre fuera del bundle de Angular y no puede importar TS.
    // Si la app la sobrescribe en EdasConfig.storageKeys, actualizar también esta línea.
    (function () {
      try {
        var raw = null;
        try {
          raw = window.localStorage.getItem('color_theme');
        } catch (storageError) {
          // Modo privado / storage deshabilitado: seguimos con el default.
          raw = null;
        }
        // Oscuro si no hay valor guardado (default = globalConfig.colorTheme)
        // o si el valor guardado empieza por "dark". La clave guarda el aspecto (light/dark;
        // la combinación va en otra clave) y, hasta que ThemeService lo convierte al arrancar,
        // puede traer aún el id compuesto de versiones anteriores (dark-teal…).
        var isDark = !raw || raw.indexOf('dark') === 0;
        document.documentElement.setAttribute('data-splash-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        // Nunca debe impedir el arranque de la app por un fallo aquí.
      }
    })();
  </script>
</head>

<script>
  // Lógica de ocultado del splash. Vive fuera del bundle de Angular a propósito:
  // debe funcionar aunque el bundle nunca llegue a arrancar (fallo de red,
  // error de bootstrap, API colgada) gracias al timeout duro de más abajo.
  (function () {
    'use strict';

    var splashEl = document.getElementById('app-splash');
    var htmlEl = document.documentElement;

    var MIN_VISIBLE_MS = 500;   // evita parpadeo cuando todo resuelve muy rápido
    var HIDE_TRANSITION_MS = 350;
    var HARD_TIMEOUT_MS = 10000; // red de seguridad: el splash no debe quedar colgado

    var shownAt = Date.now();
    var hideRequested = false;
    var hidden = false;
    var hardTimeoutId = null;

    function revertThemeAttribute() {
      try {
        htmlEl.removeAttribute('data-splash-theme');
      } catch (e) {
        // no-op
      }
    }

    function doHide() {
      if (hidden) {
        return;
      }
      hidden = true;

      if (hardTimeoutId !== null) {
        clearTimeout(hardTimeoutId);
        hardTimeoutId = null;
      }

      if (!splashEl) {
        revertThemeAttribute();
        return;
      }

      splashEl.classList.add('app-splash--hidden');
      setTimeout(function () {
        if (splashEl && splashEl.parentNode) {
          splashEl.parentNode.removeChild(splashEl);
        }
        // El usuario puede haber cambiado de tema mientras la app cargaba:
        // un color de html/body fijado a fuego quedaría obsoleto, así que
        // se revierte y el propio CSS de la app toma el relevo.
        revertThemeAttribute();
      }, HIDE_TRANSITION_MS);
    }

    // Idempotente: la primera llamada arma el temporizador (respetando el
    // mínimo visible); cualquier llamada posterior no hace nada.
    function hide() {
      if (hideRequested) {
        return;
      }
      hideRequested = true;

      var elapsed = Date.now() - shownAt;
      var remaining = MIN_VISIBLE_MS - elapsed;
      if (remaining > 0) {
        setTimeout(doHide, remaining);
      } else {
        doHide();
      }
    }

    var readyCalled = false;
    function ready() {
      if (readyCalled) {
        return;
      }
      readyCalled = true;
      hide();
    }

    hardTimeoutId = setTimeout(function () {
      hide();
    }, HARD_TIMEOUT_MS);

    window.__edasSplash = {
      ready: ready,
      hide: hide
    };
  })();
</script>
